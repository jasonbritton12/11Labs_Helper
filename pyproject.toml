[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elevenlabs-helper"
version = "0.1.0"
description = "Convert media to audio, transcribe via ElevenLabs Scribe, and manage deliverables. Reusable engine + Mac desktop GUI."
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "keyring>=24",
    "python-docx>=1.1",
    "mutagen>=1.47",  # pure-python: read audio duration without ffmpeg
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pip-tools>=7",   # pip-compile for the hash-pinned requirements.lock
    "pip-audit>=2.7", # dependency vulnerability scanning (release gate)
]

[project.scripts]
elevenlabs-helper = "elevenlabs_helper.engine.cli:main"

[project.gui-scripts]
elevenlabs-helper-gui = "elevenlabs_helper.desktop.app:main"

[tool.setuptools]
packages = [
    "elevenlabs_helper",
    "elevenlabs_helper.engine",
    "elevenlabs_helper.engine.media",
    "elevenlabs_helper.engine.elevenlabs",
    "elevenlabs_helper.engine.processors",
    "elevenlabs_helper.engine.exporters",
    "elevenlabs_helper.engine.jobs",
    "elevenlabs_helper.desktop",
    "elevenlabs_helper.desktop.windows",
    "elevenlabs_helper.desktop.widgets",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
