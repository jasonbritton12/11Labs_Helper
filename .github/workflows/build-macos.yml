name: Build macOS app

# Produces both an Apple Silicon and an Intel .dmg on native runners, with
# SHA-256 checksums. Runs on a version tag (and can be run manually). On a tag,
# both .dmgs are attached to the GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to attach assets to the release on tag

jobs:
  build:
    name: ${{ matrix.arch }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          - runner: macos-13   # Intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller

      - name: Build .app + .dmg (native arch)
        run: bash packaging/build_dmg.sh   # TARGET_ARCH unset => the runner's native arch

      - name: Rename + checksum
        run: |
          mkdir -p out
          cp "dist/ElevenLabs Helper.dmg" "out/ElevenLabs-Helper-${{ matrix.arch }}.dmg"
          cd out
          shasum -a 256 "ElevenLabs-Helper-${{ matrix.arch }}.dmg" \
            | tee "ElevenLabs-Helper-${{ matrix.arch }}.dmg.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElevenLabs-Helper-${{ matrix.arch }}
          path: out/*

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
